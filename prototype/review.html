<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Desembarque — review prototype</title>
<style>
  :root{
    --bg:#f6f4ef; --panel:#fffdf8; --ink:#2b2722; --muted:#7a7167; --line:#ded6c8;
    --accent:#8c5a2b; --accent-soft:#f0e3d2; --ok:#3f7d4f; --warn:#b8860b; --bad:#a4453a;
    --focus:#c9853f;
  }
  @media (prefers-color-scheme:dark){:root:not([data-theme=light]){
    --bg:#191715; --panel:#221f1c; --ink:#ece5da; --muted:#9c9287; --line:#3a352f;
    --accent:#d79a5b; --accent-soft:#33291f; --ok:#7fb98c; --warn:#d9b45c; --bad:#e08a7e;
  }}
  *{box-sizing:border-box}
  body{margin:0;font:14px/1.45 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
       background:var(--bg);color:var(--ink);height:100vh;display:flex;flex-direction:column}
  header{display:flex;gap:14px;align-items:center;padding:9px 14px;border-bottom:1px solid var(--line);
         background:var(--panel);flex-wrap:wrap}
  h1{font-size:14px;margin:0;font-weight:650;letter-spacing:.01em}
  .meta{color:var(--muted);font-size:12px;min-width:0;overflow:hidden;
        text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto}
  .meta b{color:var(--ink);font-weight:600}
  .spacer{flex:0 0 0}
  button,.toggle{font:inherit;font-size:12px;padding:5px 10px;border:1px solid var(--line);
    border-radius:7px;background:var(--panel);color:var(--ink);cursor:pointer}
  button:hover{border-color:var(--accent)}
  button[aria-pressed=true]{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
  #find{display:flex;align-items:center;gap:6px}
  #findq{font:inherit;font-size:12px;padding:5px 8px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);width:170px;min-width:110px}
  #find{flex:0 1 auto}
  #findq:focus{outline:2px solid var(--focus);outline-offset:1px}
  /* The scope control sat on the header in the header's own colour with the
     browser's default arrow — Allan could not see there was a control there at
     all. It carries the page background against the panel, a border that reads
     as an edge, and an arrow at text size. */
  .combo{position:relative}
  #scopebtn{display:flex;align-items:center;gap:8px;font-size:12px;padding:5px 8px;
    background:var(--bg);border:1px solid var(--line);border-radius:7px;min-width:104px}
  #scopebtn:hover,#scopebtn[aria-expanded=true]{border-color:var(--accent)}
  #scopebtn[aria-expanded=true]{background:var(--accent-soft)}
  .chev{font-size:15px;line-height:1;color:var(--accent);margin-left:auto}
  #scopemenu{position:absolute;z-index:40;top:calc(100% + 4px);left:0;min-width:100%;
    margin:0;padding:4px;list-style:none;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18)}
  #scopemenu li{padding:6px 10px;border-radius:5px;font-size:12px;white-space:nowrap;cursor:pointer}
  #scopemenu li:hover,#scopemenu li.on{background:var(--accent-soft)}
  #scopemenu li[aria-selected=true]{font-weight:600}
  #findcount{font-size:11px;color:var(--muted);min-width:62px;font-variant-numeric:tabular-nums}
  main{flex:1;display:grid;grid-template-columns:230px 1fr 1fr;min-height:0}
  main.nosidebar{grid-template-columns:0 1fr 1fr}
  @media (max-width:980px){main{grid-template-columns:0 1fr 1fr}}
  #sidebar{overflow:auto;border-right:1px solid var(--line);background:var(--panel);min-width:0}
  main.nosidebar #sidebar{display:none}
  .doc{padding:7px 10px;border-bottom:1px solid var(--line);cursor:pointer;font-size:12px}
  .doc:hover{background:var(--accent-soft)}
  .doc.on{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  .doc b{display:block;font-weight:600;text-transform:capitalize}
  .doc span{color:var(--muted);font-size:10.5px;font-variant-numeric:tabular-nums}
  .doc .badge{display:inline-block;margin-top:3px;padding:0 5px;border-radius:99px;font-size:9.5px;
    background:var(--ok);color:#fff;letter-spacing:.02em}
  .sidehead{position:sticky;top:0;background:var(--panel);border-bottom:1.5px solid var(--line);
    padding:7px 10px;font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);
    z-index:2;display:flex;align-items:center;gap:6px}
  .sidehead button{margin-left:auto;padding:2px 7px;font-size:10.5px}
  /* A word the engine read two ways. The outline says it can be changed; the
     caret says there is something behind it. Same grammar as the other
     changeable controls on this page. */
  .altword{border:1px solid var(--line);border-radius:3px;padding:0 3px;cursor:pointer;
    white-space:nowrap}
  .altword:hover{border-color:var(--focus)}
  .altword i{font-style:normal;color:var(--muted);font-size:9px;margin-left:2px}
  .altmenu{position:absolute;z-index:20;background:var(--panel);border:1px solid var(--line);
    border-radius:4px;box-shadow:0 4px 14px rgba(0,0,0,.25);padding:3px;min-width:120px}
  .altmenu button{display:block;width:100%;text-align:left;padding:3px 7px;font-size:12px;
    border:0;background:none;cursor:pointer;color:var(--ink)}
  .altmenu button:hover{background:rgba(120,150,200,.18)}
  .altmenu button.on{font-weight:600}
  .altmenu .why{color:var(--muted);font-size:10px;padding:2px 7px 4px}
  #exportcsv{display:inline-block;padding:3px 9px;font-size:11.5px;
    border:1px solid var(--line);border-radius:4px;color:var(--ink);
    text-decoration:none;cursor:pointer}
  #exportcsv[aria-disabled="true"]{opacity:.45;pointer-events:none}
  body.editing td[contenteditable="true"],
  body.editing span[contenteditable="true"]{background:#fffbe6}
  body.editing #editmode{background:var(--focus);color:#fff}
  #indexbar{padding:7px 10px;border-bottom:1.5px solid var(--line);display:flex;
    flex-direction:column;align-items:flex-start;gap:5px;background:var(--panel)}
  #indexbar button{padding:3px 9px;font-size:11.5px}
  #indexbar .hint{font-size:10.5px;color:var(--muted);line-height:1.35}
  #indexbar .bar{width:100%}
  #corpusfind{padding:7px 10px;border-bottom:1.5px solid var(--line);background:var(--panel)}
  #corpusq{width:100%;padding:4px 7px;font-size:12px}
  #corpushits{margin-top:6px;display:flex;flex-direction:column;gap:4px}
  #corpushits .hit{padding:4px 6px;border:1px solid var(--line);border-radius:4px;
    cursor:pointer;font-size:11.5px;line-height:1.3}
  #corpushits .hit b{display:block;font-weight:600}
  #corpushits .hit.on{border-color:var(--accent,#456);background:rgba(120,150,200,.12)}
  #corpushits .hit span{color:var(--muted);font-size:10px}
  #corpushits .none{color:var(--muted);font-size:10.5px}
  #crumb{padding:6px 10px;font-size:11px;color:var(--muted);border-bottom:1px solid var(--line);
    word-break:break-all}
  .dir{padding:5px 10px;font-size:12px;cursor:pointer;border-bottom:1px solid var(--line)}
  .dir:hover{background:var(--accent-soft)}
  .dir::before{content:"📁 ";font-size:10px}
  .dir.up::before{content:"↰ "}
  #pagestrip{display:flex;gap:4px;padding:6px;border-bottom:1px solid var(--line);
    background:var(--panel);position:sticky;top:0;z-index:3;flex-wrap:wrap}
  #pagestrip button{padding:3px 9px;font-size:11px}
  .empty{padding:26px 18px;color:var(--muted);font-size:12.5px;line-height:1.6}
  .empty b{color:var(--ink)}
  .empty button{margin-top:12px;padding:7px 13px;font-size:12.5px}
  .bar{height:5px;background:var(--line);border-radius:99px;overflow:hidden;margin:12px 0 6px;max-width:320px}
  .bar i{display:block;height:100%;background:var(--accent);transition:width .3s ease}
  .spin{display:inline-block;width:11px;height:11px;border:2px solid var(--line);
    border-top-color:var(--accent);border-radius:50%;animation:sp .7s linear infinite;
    vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
  .warnstate{color:var(--warn)}
  .pane{overflow:auto;position:relative;min-height:0}
  #scanPane{background:#0e0d0c;border-right:1px solid var(--line)}
  #scanInner{position:relative;width:100%}
  #scan{display:block;width:100%;height:auto}
  #bandBox{position:absolute;left:0;right:0;border-top:1px solid var(--focus);
    border-bottom:1px solid var(--focus);background:rgba(201,133,63,.16);pointer-events:none;
    transition:top .12s ease,height .12s ease}
  #nameBox{position:absolute;border:1.5px solid var(--focus);border-radius:2px;
    box-shadow:0 0 0 9999px rgba(0,0,0,.42);pointer-events:none;transition:all .12s ease}
  #rowPane{background:var(--panel)}
  table{border-collapse:collapse;width:100%;font-size:12.5px}
  thead th{position:sticky;top:0;background:var(--panel);border-bottom:1.5px solid var(--line);
    text-align:left;padding:7px 6px;font-weight:600;font-size:11px;letter-spacing:.03em;
    text-transform:uppercase;color:var(--muted);z-index:2}
  tbody tr{border-bottom:1px solid var(--line);cursor:pointer}
  tbody tr:hover{background:var(--accent-soft)}
  tbody tr.sel{background:var(--accent-soft);box-shadow:inset 3px 0 0 var(--accent)}
  tbody tr.verified{opacity:.72}
  td{padding:5px 6px;vertical-align:top}
  td [contenteditable]:focus,td[contenteditable]:focus{outline:2px solid var(--focus);
     outline-offset:-2px;background:var(--bg)}
  .cellwrap{white-space:normal}
  .num{color:var(--muted);font-variant-numeric:tabular-nums;width:26px}
  .name{font-weight:600}
  /* Confidence is shown as a semaphore dot after the value, not as a wavy
     underline: a wavy underline is the spellchecker's "misspelled word" signal,
     and these documents are full of names no dictionary contains, so it reads
     as a complaint about spelling rather than a statement about trust.
     Shape carries the meaning as well as colour, for colour-blind readers. */
  .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;
       vertical-align:1px;border:1.5px solid transparent}
  /* A high decode score is not a high chance of being right: `Brges. iuig`
     scores 0.86. So the engine's own number is shown neutral, and the green
     dot means the one thing that does warrant it — a person read the scan. */
  .dot.hi{background:var(--muted);border-color:var(--muted)}
  .dot.person{background:var(--ok);border-color:var(--ok)}
  /* Rows whose reading resembles no name this archive carries. A claim about
     the archive, not about the row: rare names live here too. */
  tr.doubt td.name{box-shadow:inset 3px 0 0 var(--warn)}
  .altmenu .why.guessy{color:var(--warn);border-top:1px solid var(--line);margin-top:4px;padding-top:5px}
  .altmenu button.guess{color:var(--warn)}
  a.dlhits{float:right;color:var(--accent);text-decoration:none;font-size:11px}
  a.dlhits:hover{text-decoration:underline}
  .altmenu button.guess i{font-style:normal;opacity:.7;margin-left:6px}
  .dot.mid{background:var(--warn);border-color:var(--warn);
           background:repeating-linear-gradient(45deg,var(--warn) 0 2px,transparent 2px 4px)}
  .dot.lo{background:transparent;border-color:var(--bad);border-style:double;border-width:3px}
  .dot.none{background:transparent;border-color:var(--muted);border-style:dotted}
  .null{color:var(--bad);font-style:italic;opacity:.75}
  .ditto{color:var(--muted)}
  .ditto::before{content:"❝ ";font-size:9px;vertical-align:2px;opacity:.6}
  /* A surname read off a repetition mark is what the page says. One taken from
     the row above because this row had no surname at all is an inference, and
     it has to look like one. */
  .ditto.guessed{border-bottom:1px dotted var(--warn)}
  .ditto.guessed::before{content:"≈ ";opacity:.8;color:var(--warn)}
  .hw{border-left:2px solid var(--warn);padding-left:4px}
  mark{background:var(--focus);color:#fff;border-radius:2px;padding:0 1px}
  tr.hit{box-shadow:inset 3px 0 0 var(--focus)}
  .v{width:22px;text-align:center;color:var(--muted)}
  tr.verified .v{color:var(--ok)}
  footer{padding:6px 14px;border-top:1px solid var(--line);background:var(--panel);
    font-size:11px;color:var(--muted);display:flex;gap:16px;flex-wrap:wrap}
  kbd{font:inherit;font-size:10px;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;padding:0 4px;background:var(--bg)}
  .warnbar{background:var(--accent-soft);color:var(--accent);padding:5px 14px;font-size:11.5px;
    border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="warnbar" id="warn"></div>
<header>
  <h1>Desembarque</h1>
  <span class="meta" id="docmeta"></span>
  <span class="spacer"></span>
  <div id="find">
    <input id="findq" placeholder="Buscar no documento…  (Ctrl+F)" autocomplete="off" spellcheck="false">
    <div class="combo" id="scopewrap">
      <button id="scopebtn" type="button" aria-haspopup="listbox" aria-expanded="false"
              title="Coluna a pesquisar"><span id="scopelabel">Nome</span><span class="chev">▾</span></button>
      <ul id="scopemenu" role="listbox" tabindex="-1" hidden></ul>
    </div>
    <select id="scope" title="Coluna a pesquisar" hidden>
      <option value="name" selected>Nome</option>
      <option value="nationality">Nacionalidade</option>
      <option value="age">Idade</option>
      <option value="sex">Sexo</option>
      <option value="status">Estado civil</option>
      <option value="occupation">Profissão</option>
      <option value="origin">Procedência</option>
      <option value="notes">Observações</option>
      <option value="all">Todas as colunas</option>
    </select>
    <span id="findcount"></span>
    <button id="guessbtn" type="button" aria-pressed="false"
      title="Mostrar nomes prováveis deste acervo junto às leituras do motor. São palpites, não leituras.">≈ Prováveis</button>
    <button id="guessfirst" type="button" aria-pressed="false" hidden
      title="Listar os palpites antes das leituras do motor">↑ primeiro</button>
    <button id="nextdoubt" type="button" hidden
      title="Ir para a próxima linha sem semelhança com nomes do acervo (tecla D)">D ↓</button>
    <button id="doubtbtn" type="button" aria-pressed="false"
      title="Marcar as linhas cuja leitura não se parece com nenhum nome deste acervo. Não quer dizer que estejam erradas.">? Duvidosas</button>
    <button id="prev" title="Anterior (Shift+Enter)">↑</button>
    <button id="next" title="Próximo (Enter)">↓</button>
  </div>
  <button id="side" aria-pressed="true" title="Mostrar ou ocultar a lista de documentos">☰</button>
  <button id="lock" aria-pressed="true" title="Travar os dois painéis juntos">⇅ Sincronizar</button>
  <button id="crop" aria-pressed="false" title="Isolar a coluna do nome">Coluna do nome</button>
  <button id="editmode" aria-pressed="false"
    title="Permitir corrigir as células. Desligado, a página é só de leitura.">✎ Corrigir</button>
  <button id="reread"
    title="Ler este documento de novo com o motor atual. Correções já salvas são mantidas.">↻ Reler</button>
  <a id="exportcsv" class="btn" download
    title="Baixar as linhas deste documento em CSV, com a origem de cada uma">⭳ Exportar</a>
</header>
<main id="main">
  <div id="sidebar">
    <div class="sidehead" id="sidehead">Documentos</div>
    <div id="indexbar"></div>
    <div id="corpusfind">
      <input id="corpusq" placeholder="Nome — ou só o navio, ou só o ano…" autocomplete="off"
             spellcheck="false" title="Procura em todos os documentos já indexados.
Um ano ou o nome do navio na busca não competem com o nome: eles reordenam o que foi encontrado.">
      <div id="corpushits"></div>
    </div>
    <div id="picker" hidden>
      <div id="crumb"></div>
      <div id="dirlist"></div>
    </div>
    <div id="doclist"></div>
  </div>
  <div class="pane" id="scanPane">
    <div id="scanInner">
      <img id="scan" alt="Digitalização original da relação de passageiros">
      <div id="bandBox" hidden></div>
      <div id="nameBox" hidden></div>
    </div>
  </div>
  <div class="pane" id="rowPane">
    <div id="pagestrip"></div>
    <div id="empty" class="empty" hidden></div>
    <table id="tbl">
      <thead><tr>
        <th class="num">#</th><th>Nome</th><th>Nacionalidade</th>
        <th>Idade</th><th>Sexo</th><th>Estado civil</th><th>Profissão</th><th>Procedência</th><th class="v">✓</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
  </div>
</main>
<footer>
  <span><kbd>Ctrl</kbd>+<kbd>F</kbd> buscar</span>
  <span><kbd>Enter</kbd>/<kbd>Shift</kbd>+<kbd>Enter</kbd> próximo/anterior</span>
  <span><kbd>↑</kbd><kbd>↓</kbd> linhas</span>
  <span><kbd>V</kbd> verificar</span>
  <span><kbd>Esc</kbd> fechar busca</span>
  <span id="stat"></span>
</footer>

<script id="payload" type="application/json">__DATA__</script>
<script>
const $ = s => document.querySelector(s);
let DB=null, D=null, docIdx=0, pageIdx=0, rows=[], sel=0, hits=[], hitAt=-1, syncing=false;
// Off by default. Every cell was editable all the time, including the ones the
// engine never attempted, so the page invited typing into fields that were
// simply not read yet — and an accidental keystroke on a legal-evidence record
// is worse than one more click before correcting anything.
let EDIT=false;
const STATE={dir:""};

// ---- fuzzy matching, standing in for the pg_trgm + phonetic + variant search ----
const fold = s => (s||"").toString().normalize("NFD").replace(/[̀-ͯ]/g,"").toLowerCase();
const VARIANTS = {joao:["giovanni","juan","jean","john"], guilherme:["wilhelm","william"],
  jose:["giuseppe","josef"], maria:["marie"], antonio:["anton","antoine"], pedro:["pietro","peter"],
  joan:["joao"], manuel:["manoel"]};
function expand(q){
  const f=fold(q), out=new Set([f]);
  for(const [k,v] of Object.entries(VARIANTS)){
    if(k===f) v.forEach(x=>out.add(x));
    if(v.includes(f)){ out.add(k); v.forEach(x=>out.add(x)); }
  }
  return [...out];
}
// trigram similarity, the same shape pg_trgm uses
function tri(s){const p="  "+s+" ",g=new Set();for(let i=0;i<p.length-2;i++)g.add(p.slice(i,i+3));return g;}
function sim(a,b){
  const A=tri(a),B=tri(b); let n=0; for(const g of A) if(B.has(g)) n++;
  return n/(A.size+B.size-n);
}
// Search is scoped, and defaults to names only. Searching every field means
// looking for "Paul" returns every passenger living in São Paulo, which buries
// the one thing a genealogical search is actually for.
const SCOPES={
  name:        r=>[r.name_raw,r.given,r.surname],
  nationality: r=>[r.nationality],
  age:         r=>[r.age],
  sex:         r=>[r.sex],
  status:      r=>[r.status],
  occupation:  r=>[r.occupation],
  origin:      r=>[r.origin],
  notes:       r=>[r.notes],
  all:         r=>[r.name_raw,r.given,r.surname,r.nationality,r.age,r.sex,r.status,r.occupation,r.origin,r.notes],
};
function rowMatches(r,q,scope){
  if(!q) return false;
  const terms=expand(q);
  const hay=(SCOPES[scope]||SCOPES.name)(r).map(fold).filter(Boolean);
  for(const t of terms){
    for(const h of hay){
      // whole-word or prefix match first; fuzzy only for words of similar length,
      // so "paul" no longer drags in "paulo" by trigram overlap alone
      for(const w of h.split(/\s+/)){
        if(!w) continue;
        if(w===t || w.startsWith(t) && t.length>=3) return true;
        // 0.44 keeps the OCR variants that matter (vasquez~vazquez scores .455)
        // without the scope-crossing noise that motivated scoping in the first place
        if(w.length>3 && Math.abs(w.length-t.length)<=2 && sim(w,t)>0.44) return true;
      }
    }
  }
  return false;
}

// ---- rendering ----
function conf(r,f){const c=r.conf&&r.conf[f];return c==null?"":c<0.5?"lo":c<0.8?"mid":"hi";}
// What the number is: the recogniser's own decode score, which stays high on
// confident nonsense. It is worth showing, because a *low* score does mean the
// motor struggled — the asymmetry is the honest part. The CSV export made the
// same distinction first, calling the column `score_motor` rather than
// `precisão`.
const CONF_LABEL={hi:"score do motor: alto — decodificação firme, não é medida de acerto",
                  mid:"score do motor: médio — conferir no original",
                  lo:"score do motor: baixo — conferir no original",
                  none:"sem valor legível"};
function dot(r,f){
  const c=r.conf&&r.conf[f];
  const k = c==null ? "none" : (c<0.5?"lo":c<0.8?"mid":"hi");
  const pct = c==null ? "" : ` (${Math.round(c*100)}%)`;
  return `<span class="dot ${k}" role="img" aria-label="${CONF_LABEL[k]}${pct}"
           title="${CONF_LABEL[k]}${pct}"></span>`;
}
function cell(r,f,txt){
  // absent and null are different claims: the engine reads the name column
  // only, so the other fields were never attempted. Marking those "ilegível"
  // would report a failure that never happened.
  if(!(f in r)) return `<td class="cellwrap"><span contenteditable="${EDIT}"
      data-f="${f}" title="não transcrito"></span></td>`;
  const isNull = txt==null;
  const d = r.ditto&&r.ditto.includes(f);
  const guessed = d && r.ditto_source==="position";
  const cls = [isNull?"null":"", d?"ditto":"", guessed?"guessed":""].filter(Boolean).join(" ");
  const val = isNull ? "ilegível" : txt;
  const DITTO_TITLE = {
    mark: 'escrito como aspas de repetição (") — resolvido a partir da linha acima',
    indent: "escrito sob as aspas da linha acima — resolvido pelo recuo",
    position: "sobrenome inferido: a linha não trouxe sobrenome legível e segue "
            + "a família acima. Confira no original.",
  };
  const title = isNull ? "ilegível — registrado como nulo, nunca adivinhado"
              : d ? (DITTO_TITLE[r.ditto_source] || DITTO_TITLE.mark) : "";
  const mark = (r.conf && f in r.conf) ? dot(r,f) : "";
  return `<td class="cellwrap"><span contenteditable="${EDIT}" data-f="${f}" class="${cls}"
           title="${title}">${val}</span>${mark}</td>`;
}
// The voyage is read off the dossier's own printed form, and most of its fields
// are missing on most pages: the clerk left them blank, or the corner is gone.
// Joining a fixed template printed "undefined" between the bullets, which reads
// as a page that said nothing where the page was never asked.
function docmetaLine(){
  const m=D.meta;
  if(!m) return `<b>${D.ship||D.notation}</b> · ${D.notation} · página ${D.pages[pageIdx].n} de ${D.total_pages}`;
  const bits=[];
  // Two claims about one ship. The archive's typed name is what the dossier is
  // filed under; the reading is what the page says, through a recogniser. Where
  // they differ the header carries both, because the scan is right there.
  const filed = m.catalog_ship, aboard = m.ship;
  const same = filed && aboard && filed.toLowerCase().replace(/[^a-z]/g,"")
                               === aboard.toLowerCase().replace(/[^a-z]/g,"");
  if(filed||aboard) bits.push(`<b>${filed||aboard}</b>${m.flag?` (${m.flag})`:""}`);
  if(filed && aboard && !same) bits.push(`lido “${aboard}”`);
  if(m.line) bits.push(m.line);
  const route=[m.origin,m.port].filter(Boolean).join(" → ");
  if(route) bits.push(route);
  if(m.arrival) bits.push(m.arrival);
  // A year inked by the port's rubber stamp is not the date the clerk wrote:
  // the stamp fails on digits, and every 1928 in this corpus is a misread 1923
  // that disagrees with the date printed on the same page. Shown as a bare
  // number it reads as a fact about the voyage.
  else if(m.year) bits.push(m.year_source==="stamp"
    ? `<span title="lido do carimbo do porto, não da data escrita">${m.year} (carimbo)</span>`
    : String(m.year));
  if(m.passengers) bits.push(`${m.passengers} imigrantes`);
  if(m.notation) bits.push(m.notation);
  const read = m.source==="parte" ? "lido da PARTE do intérprete"
             : m.source==="lista" ? "lido do cabeçalho da lista" : "";
  return `<span title="${read}">${bits.join(" · ")}</span>`;
}
// What the page says, in the order it says it. The cell used to show the split
// of the name put back together the other way round — BS.ENT.013990 reads
// `Raymundo Cassaudii` and the row showed `Cassaudii Nayomgo`. The split into
// surname and given name is a derivation, and on these forms it is derived the
// wrong way round often enough to matter; the reading is not.
function nameText(r){
  if(r.name_raw) return r.name_raw;
  return [r.given, r.surname].filter(Boolean).join(" ");
}
// The same convention as desembarque/engine_paddle.py split_name: these tables
// are written surname-first with compound surnames spelled out and the given
// name last. Editing a cell used to split it the other way round, so a person
// correcting a name silently reversed what the engine had derived.
function splitName(t){
  const p=(t||"").trim().split(/\s+/).filter(Boolean);
  if(!p.length) return ["",""];
  if(p.length===1) return [p[0],""];
  return [p.slice(0,-1).join(" "), p[p.length-1]];
}
// A word the recogniser read more than one way is shown as a control, so the
// other reading can be chosen instead of retyped. The alternatives are the
// engine's own output — the mask reading and the render reading of the same
// band — never a dictionary and never a guess.
//
// Only when the cell is not being typed into: pills inside a contenteditable
// region get torn apart by the first keystroke, and free typing already has a
// mode of its own.
function nameCell(r){
  const text = nameText(r);
  const alts = r.name_alts;
  if(EDIT || !alts || !alts.some(a=>a && a.length)) return text;
  return text.split(/\s+/).map((w,i)=>{
    const a = alts[i];
    if(!a || !a.length) return w;
    return `<span class="altword" data-w="${i}" title="o motor também leu: ${a.join(", ")}"
      >${w}<i>&#9662;</i></span>`;
  }).join(" ");
}
// Which rows resemble no name this archive carries, so a person checking four
// hundred rows knows where to start. Asked for once per page and never stored:
// it is an opinion about the reading, and the reading is the record.
let DOUBTS=false;
function markDoubtful(){
  document.querySelectorAll("#rows tr.doubt").forEach(tr=>tr.classList.remove("doubt"));
  if(!DOUBTS || !SERVED || !D) return;
  const n=(D.pages[pageIdx]||{}).n;
  fetch(`/api/check?hash=${encodeURIComponent(D.hash||"")}&page=${n}`)
    .then(r=>r.json()).then(j=>{
      const bad=new Set((j.rows||[]).filter(r=>r.doubtful).map(r=>r.n));
      rows.forEach((r,i)=>{
        if(bad.has(r.n)){
          const tr=document.querySelector(`#rows tr[data-i="${i}"]`);
          if(tr){ tr.classList.add("doubt");
                  tr.title="nenhuma palavra desta leitura se parece com um nome "
                         + "deste acervo — confira no original"; }
        }
      });
      $("#stat").textContent=`${j.doubtful} de ${j.of} linhas sem semelhança com nomes do acervo`;
    }).catch(()=>{});
}
$("#doubtbtn").addEventListener("click",()=>{
  DOUBTS=!DOUBTS;
  $("#doubtbtn").setAttribute("aria-pressed", DOUBTS?"true":"false");
  $("#nextdoubt").hidden=!DOUBTS;
  markDoubtful();
});
// Four hundred rows, a few dozen worth a second look, and no way to walk them:
// scrolling past thirty good rows to find the next doubtful one is how a person
// stops checking.
function nextDoubtful(){
  const marked=[...document.querySelectorAll("#rows tr.doubt")]
    .map(tr=>+tr.dataset.i).sort((a,b)=>a-b);
  if(!marked.length){
    const none="nenhuma linha duvidosa nesta página";
    $("#nextdoubt").dataset.at=none; $("#nextdoubt").title=none;
    $("#stat").textContent=none;
    return;
  }
  const next = marked.find(i=>i>sel);
  const wrapped = next===undefined;
  select(wrapped ? marked[0] : next);
  const tr=document.querySelector(`#rows tr[data-i="${sel}"]`);
  if(tr) tr.scrollIntoView({block:"center"});
  // Always say where this landed. When the only doubtful row is the one already
  // selected, pressing the key looked like nothing happening at all.
  const at=marked.indexOf(sel)+1;
  const said=`duvidosa ${at} de ${marked.length}`
    + (rows[sel]?` · linha ${rows[sel].n}`:"")
    + (wrapped && marked.length>1?" · recomeçou do topo":"");
  // On the control itself rather than in the status line, which the autosave
  // and the verification count also write to: where this landed has to survive
  // the next thing that happens.
  $("#nextdoubt").dataset.at=said;
  $("#nextdoubt").title=said;
  $("#stat").textContent=said;
}
$("#nextdoubt").addEventListener("click",nextDoubtful);
document.addEventListener("keydown",e=>{
  if(e.key!=="d" && e.key!=="D") return;
  if(/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if(!DOUBTS) return;
  e.preventDefault();
  nextDoubtful();
});

function render(){
  $("#rows").innerHTML = rows.map((r,i)=>`
    <tr data-i="${i}" class="${r.verified?"verified":""}">
      <td class="num">${r.n}</td>
      <td class="name ${r.handwritten?'hw':''}"><span contenteditable="${EDIT}" data-f="name"
          title="${r.handwritten?'entrada manuscrita':''}">${nameCell(r)}</span>${r.conf&&'surname' in r.conf?dot(r,'surname'):''}</td>
      ${cell(r,"nationality",r.nationality)}
      ${cell(r,"age",r.age)}
      <td>${r.sex||""}</td>
      <td>${r.status||""}</td>
      ${cell(r,"occupation",r.occupation)}
      ${cell(r,"origin",r.origin)}
      <td class="v" data-v="1" title="Marcar como verificado (V)">${r.verified?"✓":"○"}</td>
    </tr>`).join("");
  select(sel,false);
  stat();
}
function stat(){
  const suffix = saveState ? ` · ${saveState}` : "";
  if(!rows.length){ $("#stat").textContent="sem transcrição"+suffix; return; }
  const v=rows.filter(r=>r.verified).length;
  const lo=rows.filter(r=>Object.values(r.conf||{}).some(c=>c!=null&&c<0.5)).length;
  $("#stat").textContent=`${v}/${rows.length} verificadas · ${lo} com campo de score baixo`+suffix;
}

function pageURL(doc,page){
  if(!SERVED) return page.file;
  const dir=STATE.dir?`&dir=${encodeURIComponent(STATE.dir)}`:"";
  return `/api/page?pdf=${encodeURIComponent(doc.file)}&n=${page.n}${dir}`;
}

// ---- documents ----
// Scanning a folder of two hundred dossiers, the useful thing to see beside the
// ship is when she landed — that is how somebody with an approximate date finds
// the handful worth opening. It is absent far more often than it is present, so
// it is a prefix rather than a column.
function docYear(d){
  const m=d.meta;
  if(!m) return "";
  const when = m.arrival || m.year;
  return when ? `${when} · ` : "";
}
function renderDocList(){
  const t=DB.documents.filter(d=>d.rows).length;
  $("#sidehead").innerHTML=`<span>${DB.documents.length} documentos · ${t} transcrito${t===1?"":"s"}</span>`
    + (SERVED?`<button id="pick" title="Escolher pasta">📂 Pasta</button>`:"");
  renderIndexBar(idxState);
  $("#doclist").innerHTML=DB.documents.map((d,i)=>`
    <div class="doc ${i===docIdx?"on":""}" data-d="${i}">
      <b>${d.ship}</b>
      <span>${docYear(d)}${d.notation} · ${d.total_pages} p.</span>
      ${d.transcribed||d.rows?'<span class="badge">transcrito</span>':""}
    </div>`).join("");
}
function renderPageStrip(){
  // How a page was measured is worth seeing: a table found from the page's own
  // printing is a different thing from one fitted to rules the scan half lost,
  // and until now nothing said which had happened.
  const HOW = {
    "printing": ["", "grade lida da própria impressão da página"],
    "printed columns, ruled rows": ["~", "coluna lida da impressão; linhas vindas das réguas da tabela"],
    "rules": ["!", "grade estimada pelas réguas — a impressão não foi encontrada"],
  };
  $("#pagestrip").innerHTML = D.pages.map(p=>{
    const isT = rowsForPage(D,p.n).length>0;
    const how = HOW[(D.measuredBy||{})[p.n]] || ["",""];
    return `<button data-p="${p.n}" aria-pressed="${p.n===D.pages[pageIdx].n}"
      title="${[isT?'página transcrita':'', how[1]].filter(Boolean).join(" · ")}"
      >p.${p.n}${isT?" ✓":""}${how[0]}</button>`;
  }).join("") + (D.total_pages>D.pages.length
    ? `<span style="align-self:center;color:var(--muted);font-size:11px">
        de ${D.total_pages} (as demais não foram renderizadas)</span>` : "");
}
// A document indexed by the engine has rows on every page it could read, so
// the table follows the page being looked at. Manually transcribed documents
// predate that and carry a single transcribed_page instead.
function rowsForPage(doc,n){
  const all = doc.rows || [];
  if(!all.length) return [];
  if(all.some(r=>r.page!=null)) return all.filter(r=>r.page===n);
  return doc.transcribed_page===n ? all : [];
}
function firstPageWithRows(doc){
  const p = (doc.pages||[]).find(pg=>rowsForPage(doc,pg.n).length);
  return p ? p.n : (doc.transcribed_page ?? (doc.pages[0]||{}).n);
}
// The bands a row is painted from are measured per page, and a dossier is read
// page by page — so they are asked for when a document opens rather than sent
// with the folder list, which would carry three and a half megabytes of them.
// The file:// build has no API and keeps the document-level measurement it was
// built with.
function loadGeometry(){
  if(!SERVED || !D || D.pageGeometry) return Promise.resolve();
  return fetch(`/api/geometry?hash=${encodeURIComponent(D.hash||"")}`)
    .then(r=>r.json()).then(g=>{
      D.pageGeometry=g.pages||{}; D.measuredBy=g.measured_by||{};
      renderPageStrip();
    })
    .catch(()=>{ D.pageGeometry={}; });
}
function applyGeometry(){
  if(!D) return;
  if(D.baseGeometry===undefined) D.baseGeometry = D.geometry || null;
  const n = (D.pages[pageIdx]||{}).n;
  D.geometry = (D.pageGeometry||{})[n] || D.baseGeometry;
}
function openDoc(i,page){
  docIdx=i; D=DB.documents[i];
  pageIdx=Math.max(0, D.pages.findIndex(p=>p.n===(page ?? firstPageWithRows(D))));
  if(pageIdx<0) pageIdx=0;
  applyGeometry();
  const pageRows = rowsForPage(D, D.pages[pageIdx].n);
  const showRows = pageRows.length>0;
  rows = pageRows.map(r=>({...r,verified:false}));
  sel=0; hits=[]; hitAt=-1;
  $("#scan").src=pageURL(D,D.pages[pageIdx]);
  $("#docmeta").innerHTML = docmetaLine();
  $("#tbl").hidden=!showRows;
  $("#empty").hidden=showRows;
  if(!showRows) renderEmpty();
  renderDocList(); renderPageStrip(); render(); paintBand(0); refreshExport();
  $("#stat").textContent = showRows ? "" : "sem transcrição";
  // and again once this dossier's own measurements arrive
  loadGeometry().then(()=>{ applyGeometry(); paintBand(sel); });
  markDoubtful();
}
$("#doclist").addEventListener("click",e=>{
  const d=e.target.closest(".doc"); if(d) openDoc(+d.dataset.d);
});

// ---- folder picker (only when served; file:// cannot list a directory) ----
function showPicker(path){
  fetch(`/api/browse?path=${encodeURIComponent(path||"")}`).then(r=>r.json()).then(b=>{
    $("#picker").hidden=false; $("#doclist").hidden=true;
    $("#crumb").textContent=(b.root||"")+(b.path?"/"+b.path:"");
    const up = b.path ? `<div class="dir up" data-p="${b.parent==="."?"":b.parent}">acima</div>` : "";
    $("#dirlist").innerHTML = up + b.dirs.map(d=>
      `<div class="dir" data-p="${b.path?b.path+"/"+d:d}">${d}</div>`).join("")
      + `<div class="doc" id="usehere"><b>Usar esta pasta</b>
         <span>${b.pdfs.length} PDF${b.pdfs.length===1?"":"s"}</span></div>`;
  });
}
document.addEventListener("click",e=>{
  if(e.target.id==="pick"){ showPicker(STATE.dir); return; }
  const d=e.target.closest("#dirlist .dir");
  if(d){ showPicker(d.dataset.p); return; }
  if(e.target.closest("#usehere")) loadFolder(currentRel());
});
function currentRel(){
  const crumb=$("#crumb").textContent, root=(DB&&DB.root)||"";
  return crumb.startsWith(root) ? crumb.slice(root.length).replace(/^\//,"") : "";
}
function loadFolder(rel){
  fetch(`/api/corpus?path=${encodeURIComponent(rel||"")}`).then(r=>r.json()).then(d=>{
    if(d.error) return;
    STATE.dir=rel||""; DB=d;
    $("#picker").hidden=true; $("#doclist").hidden=false;
    if(!d.documents.length){
      $("#doclist").innerHTML=`<div class="empty">Nenhum PDF nesta pasta.</div>`;
      return;
    }
    openDoc(d.active||0);
  });
}
// Asked for on its own, and first. While a folder is being indexed the engine
// holds the machine and /api/corpus can take half a minute, so hanging the
// index bar off that response meant the one thing able to explain the wait was
// the one thing that could not appear until the wait was over.
function bootIndexBar(){
  if(!SERVED) return;
  fetch("/api/index").then(r=>r.json()).then(st=>{
    renderIndexBar(st);
    if(st.status==="running"){ clearInterval(idxPoll); idxPoll=setInterval(pollIndex,1200); }
  }).catch(()=>{});
}
$("#pagestrip").addEventListener("click",e=>{
  const b=e.target.closest("button"); if(b) openDoc(docIdx,+b.dataset.p);
});
$("#side").onclick=e=>{
  const b=e.currentTarget, on=b.getAttribute("aria-pressed")!=="true";
  b.setAttribute("aria-pressed",String(on));
  $("#main").classList.toggle("nosidebar",!on);
  paintBand(sel);
};

// ---- transcription state ----
function renderEmpty(msg){
  const e=$("#empty");
  if(msg){ e.innerHTML=msg; return; }
  if(D.rows && D.transcribed_page){
    e.innerHTML=`<b>Página ${D.pages[pageIdx].n} não transcrita.</b><br>
      A transcrição deste documento cobre a página ${D.transcribed_page}.`;
    return;
  }
  const engineOK = ENGINE && ENGINE.available;
  e.innerHTML = `<b>Documento não transcrito.</b><br>
    ${engineOK
      ? "Clique abaixo para transcrever. O original fica ao lado para conferência."
      : `<span class="warnstate">${(ENGINE&&ENGINE.detail)||"Motor de transcrição indisponível."}</span>
         <br>Nada é inventado: nenhuma linha aparece sem transcrição real.`}
    ${SERVED ? `<br><button id="dotranscribe" ${engineOK?"":"disabled"}>Transcrever documento</button>
       <button id="dogrid" title="Detecta a grade da tabela sem modelo: linhas vazias para preencher à mão">Gerar tabela vazia</button>` : ""}`;
}
let ENGINE=null, poll=null;
// Reading a document again is how an engine improvement reaches a dossier that
// is already in the cache. Without it the only way was to delete the file by
// hand, so the tool got better and the documents somebody was looking at did
// not.
function startTranscription(force){
  if(!SERVED||!D) return;
  clearInterval(poll);
  const dir=STATE.dir?`&dir=${encodeURIComponent(STATE.dir)}`:"";
  renderEmpty(`<b><span class="spin"></span>Transcrevendo…</b><br>
     ${D.ship||D.notation} · ${D.total_pages} páginas
     <div class="bar"><i style="width:2%"></i></div>
     <span id="prog">iniciando</span>`);
  fetch(`/api/transcribe?pdf=${encodeURIComponent(D.file)}${dir}${force?"&force=1":""}`,
        {method:"POST"})
    .then(r=>r.json()).then(j=>{
      if(j.cached||j.status==="done") return finishTranscription();
      if(j.status==="unavailable") return renderEmpty(
        `<b>Transcrição indisponível.</b><br><span class="warnstate">${j.message||""}</span>`);
      poll=setInterval(()=>pollJob(j.id),600);
    }).catch(e=>renderEmpty(`<b>Falhou.</b><br>${e}`));
}
function pollJob(id){
  fetch(`/api/job?id=${id}`).then(r=>r.json()).then(j=>{
    if(j.status==="running"||j.status==="queued"){
      const pct=j.total?Math.max(2,Math.round(100*j.page/j.total)):5;
      const bar=document.querySelector(".bar i"), pr=$("#prog");
      if(bar) bar.style.width=pct+"%";
      if(pr) pr.textContent=`página ${j.page||0} de ${j.total} · ${j.elapsed}s`;
      return;
    }
    clearInterval(poll);
    if(j.status==="done") return finishTranscription();
    renderEmpty(`<b>${j.status==="unavailable"?"Transcrição indisponível.":"Erro na transcrição."}</b>
      <br><span class="warnstate">${j.message||""}</span>`);
  });
}
function finishTranscription(){
  fetch(`/api/corpus?path=${encodeURIComponent(STATE.dir||"")}`).then(r=>r.json()).then(d=>{
    DB=d; openDoc(docIdx);
  });
}
document.addEventListener("click",e=>{
  if(e.target.id==="dotranscribe") startTranscription();
  if(e.target.id==="dogrid") buildGrid();
});

// ---- search across everything indexed ----
// Searching the open document assumes the user already knows which dossier to
// open. They do not — that is the problem the index exists to solve — so this
// searches every row that has been transcribed, in any document.
let corpusTimer=null;
function renderHits(d){
  const el=$("#corpushits"); if(!el) return;
  if(!d){ el.innerHTML=""; return; }
  if(!d.hits.length){
    el.innerHTML=`<div class="none">${d.indexed
      ? `Nada parecido entre ${d.indexed} linhas indexadas.`
      : "Nada indexado ainda — use “Indexar esta pasta”."}</div>`;
    return;
  }
  const shown=Math.min(25,d.hits.length);
  // The list is the point of the tool for somebody tracing an ancestor: the
  // page shows twenty-five, and what they need is all of them, on paper, with
  // the notation and the line to ask the archive for.
  const dl = SERVED
    ? `<a class="dlhits" href="/api/export/search?q=${encodeURIComponent(d.query||"")}"
         title="Baixar todos os resultados como planilha — candidatos a conferir, não confirmações">↓ CSV</a>`
    : "";
  el.innerHTML=`<div class="none">${d.hits.length>shown
      ? `${shown} de ${d.hits.length} resultados` : `${d.hits.length} resultado${d.hits.length===1?"":"s"}`}
      · ${d.indexed} linhas indexadas ${dl}</div>`
    + d.hits.slice(0,25).map(h=>`
    <div class="hit" data-file="${h.file||""}" data-page="${h.page||1}"
         data-row="${h.row||0}" title="Abrir o documento nesta linha">
      <b>${h.text}</b>
      <span>${h.matched?"a bordo · ":""}${[h.ship, h.year?`${h.year}${h.year_source==="stamp"?" (carimbo)":""}`:null].filter(Boolean).join(" · ")}${h.ship||h.year?" · ":""}${h.notation||h.file||""} · p.${h.page||"?"} · linha ${h.row||"?"}
        ${h.conf==null?"":`<span class="dot ${h.conf<0.5?"lo":h.conf<0.8?"mid":"hi"}"
          role="img" aria-label="score do motor: ${Math.round(h.conf*100)}%"
          title="score do motor: ${Math.round(h.conf*100)}% — não é medida de acerto"></span>`}</span>
    </div>`).join("");
}
function corpusSearch(q){
  if(!SERVED) return;
  if(!q || q.trim().length<3){ renderHits(null); return; }
  fetch(`/api/search?q=${encodeURIComponent(q)}`)
    .then(r=>r.json()).then(renderHits).catch(()=>renderHits(null));
}
document.addEventListener("input",e=>{
  if(e.target.id!=="corpusq") return;
  clearTimeout(corpusTimer);
  const v=e.target.value;
  corpusTimer=setTimeout(()=>corpusSearch(v),250);
});
document.addEventListener("click",e=>{
  const h=e.target.closest("#corpushits .hit"); if(!h) return;
  const i=DB.documents.findIndex(d=>d.file===h.dataset.file);
  if(i<0) return;
  openDoc(i, +h.dataset.page||undefined);
  // land on the row itself, marked against the scan. A hit the user then has to
  // hunt for on the page is most of the work left undone — and the scan beside
  // it is the only thing that makes a fuzzy match trustworthy.
  const want=+h.dataset.row;
  const k=rows.findIndex(r=>r.n===want);
  if(k>=0) select(k);
  document.querySelectorAll("#corpushits .hit").forEach(x=>x.classList.remove("on"));
  h.classList.add("on");
});

// ---- folder indexing ----
// Reading one dossier is something a person does better than a machine. The
// machine wins over a folder nobody has time to read, so indexing a whole
// folder is the main action, and it says plainly how long it will take and
// lets you stop.
let idxPoll=null, idxState=null;
function humanTime(s){
  if(s==null||!isFinite(s)) return "";
  if(s<90) return `${Math.round(s)} s`;
  if(s<5400) return `${Math.round(s/60)} min`;
  const h=Math.floor(s/3600), m=Math.round((s%3600)/60);
  return m ? `${h} h ${m} min` : `${h} h`;
}
function renderIndexBar(st){
  idxState=st;
  const el=$("#indexbar"); if(!el) return;
  if(!SERVED){ el.innerHTML=""; return; }
  const engineOK = ENGINE && ENGINE.available;
  const total=DB && DB.documents ? DB.documents.length : 0;
  if(!st || st.status==="idle"){
    el.innerHTML = `<button id="doindex" ${engineOK?"":"disabled"}>Indexar esta pasta</button>
      <span class="hint">${engineOK
        ? `Lê os ${total} documentos e deixa todos pesquisáveis. Demora, e roda sozinho — pode parar quando quiser.`
        : ((ENGINE&&ENGINE.detail)||"Motor de transcrição indisponível.")}</span>`;
    return;
  }
  const seen=(st.done||0)+(st.skipped||0);
  const pct=st.total?Math.max(2,Math.round(100*seen/st.total)):2;
  const fails=(st.failed||[]).length;
  if(st.status==="running"){
    el.innerHTML = `<div class="bar"><i style="width:${pct}%"></i></div>
      <span class="hint"><b>${seen} de ${st.total}</b>${st.skipped?` · ${st.skipped} já feitos`:""}
      ${fails?` · <span class="warnstate">${fails} com erro</span>`:""}
      ${st.eta_s?` · faltam cerca de ${humanTime(st.eta_s)}`:""}</span>
      <span class="hint" id="idxslow"><span class="warnstate">A leitura ocupa a máquina:</span>
      abrir documentos e pesquisar fica lento até terminar, e o que já foi lido
      só aparece depois de recarregar a página. Pode parar e continuar depois —
      nada do que já foi lido se perde.</span>
      <span class="hint">${st.current||""}</span>
      <button id="stopindex">Parar</button>`;
    return;
  }
  const word = st.status==="stopped" ? "Parado" : "Pasta indexada";
  el.innerHTML = `<span class="hint"><b>${word}:</b> ${seen} de ${st.total} documentos.
    ${fails?`<span class="warnstate">${fails} não puderam ser lidos:</span> `
        +(st.failed.slice(0,3).map(f=>f.file).join(", "))+(fails>3?"…":""):""}
    Recarregue a página para ver o que foi lido.</span>
    <button id="reloadpage">Recarregar</button>
    <button id="doindex">${st.status==="stopped"?"Continuar":"Indexar de novo"}</button>`;
}
function pollIndex(){
  fetch("/api/index").then(r=>r.json()).then(st=>{
    renderIndexBar(st);
    if(st.status!=="running"){
      clearInterval(idxPoll); idxPoll=null;
      if(st.status==="finished"||st.status==="stopped") finishTranscription();
    }
  }).catch(()=>{ clearInterval(idxPoll); idxPoll=null; });
}
function startIndexing(){
  if(!SERVED) return;
  const dir=STATE.dir?`?dir=${encodeURIComponent(STATE.dir)}`:"?dir=";
  fetch(`/api/index${dir}`,{method:"POST"}).then(r=>r.json()).then(st=>{
    if(st.error){ renderIndexBar(null); $("#indexbar").innerHTML=
      `<span class="warnstate">${st.error}</span>`; return; }
    renderIndexBar(st);
    clearInterval(idxPoll); idxPoll=setInterval(pollIndex,1200);
  });
}
document.addEventListener("click",e=>{
  if(e.target.id==="doindex") startIndexing();
  if(e.target.id==="stopindex")
    fetch("/api/index/stop",{method:"POST"}).then(r=>r.json()).then(renderIndexBar);
  if(e.target.id==="reloadpage") location.reload();
});

// Structure without recognition: the table's rules and written lines are
// measurable, so an empty grid aligned to the scan can be produced with no
// model at all, and filled in by hand against the original.
function buildGrid(){
  if(!SERVED||!D) return;
  const dir=STATE.dir?`&dir=${encodeURIComponent(STATE.dir)}`:"";
  renderEmpty(`<b><span class="spin"></span>Detectando a grade…</b>`);
  fetch(`/api/grid?pdf=${encodeURIComponent(D.file)}&n=${D.pages[pageIdx].n}${dir}`)
    .then(r=>r.json()).then(g=>{
      if(!g.detected) return renderEmpty(
        `<b>Não foi possível detectar uma tabela.</b><br>${g.reason||""}<br>
         Páginas manuscritas ou sem réguas não têm grade para medir.`);
      D.geometry=g.geometry; D.rows=g.rows; D.transcribed_page=D.pages[pageIdx].n;
      rows=g.rows.map(r=>({...r,verified:false}));
      $("#tbl").hidden=false; $("#empty").hidden=true;
      $("#warn").textContent="Grade detectada geometricamente. Células vazias — "
        +"preencha conferindo com o original ao lado.";
      render(); select(0);
    }).catch(e=>renderEmpty(`<b>Falhou.</b><br>${e}`));
}

// ---- geometry: band for row i ----
// Both names for the same measurement are accepted. `/api/grid` calls it
// `row_bands`; the engine stored it as `rows`. Reading only one of them meant
// every engine-transcribed page fell through to a pitch that was never stored,
// computed NaN, and painted nothing — clicking a name stopped highlighting it,
// silently, on exactly the pages that had been read successfully. The server
// now normalises this too; the UI accepts both so the two cannot drift apart
// again without something noticing.
function band(i){
  const g=(D && D.geometry) || {};
  const bands=g.row_bands || g.rows;
  if(bands && bands[i]) return bands[i];
  if(typeof g.first_row_top==="number" && typeof g.row_pitch==="number"){
    const top=g.first_row_top + i*g.row_pitch;
    return [top, top+(g.row_height!=null?g.row_height:g.row_pitch)];
  }
  return null;   // nothing measured: say so rather than paint a NaN box
}
function nameColumn(){
  const g=(D && D.geometry) || {};
  if(g.name_column) return g.name_column;
  const c=g.columns||[];
  let best=null;
  for(let i=0;i+1<c.length;i++)
    if(!best || c[i+1]-c[i] > best[1]-best[0]) best=[c[i],c[i+1]];
  return best;
}
function paintBand(i){
  const img=$("#scan");
  if(!img.clientHeight || !D.geometry || !rows.length){
    $("#bandBox").hidden=true; $("#nameBox").hidden=true; return;
  }
  const bnd=band(i);
  if(!bnd || !isFinite(bnd[0]) || !isFinite(bnd[1])){
    $("#bandBox").hidden=true; $("#nameBox").hidden=true; return;
  }
  const [t,b]=bnd, H=img.clientHeight, W=img.clientWidth;
  const bb=$("#bandBox"); bb.hidden=false;
  bb.style.top=(t*H)+"px"; bb.style.height=((b-t)*H)+"px";
  const nb=$("#nameBox");
  if($("#crop").getAttribute("aria-pressed")==="true"){
    const nc=nameColumn();
    if(!nc){ nb.hidden=true; return; }
    const [x0,x1]=nc;
    nb.hidden=false; nb.style.top=(t*H)+"px"; nb.style.height=((b-t)*H)+"px";
    nb.style.left=(x0*W)+"px"; nb.style.width=((x1-x0)*W)+"px";
  } else nb.hidden=true;
}

// ---- selection + synchronized scrolling ----
function select(i,scroll=true){
  if(i<0||i>=rows.length||!rows.length) return;
  sel=i;
  document.querySelectorAll("#rows tr").forEach(tr=>tr.classList.toggle("sel",+tr.dataset.i===i));
  paintBand(i);
  const tr=document.querySelector(`#rows tr[data-i="${i}"]`);
  if(scroll&&tr) tr.scrollIntoView({block:"nearest"});
  if(locked()) scanToRow(i);
}
const locked = ()=>$("#lock").getAttribute("aria-pressed")==="true";
// One shared guard, released on the next frame. A timed guard (the first
// version used 220ms) swallows any scroll the user makes right after clicking
// a row, which is exactly what someone verifying a page does. Sync scrolling is
// instant for the same reason: a smooth animation keeps firing scroll events
// after the guard clears, and the two panes start driving each other.
function guarded(fn){
  syncing=true; fn();
  // Released by whichever fires first. requestAnimationFrame alone is not safe:
  // it is throttled to zero in background tabs, so a guard set just before the
  // tab loses focus would never clear and scroll sync would silently die.
  const clear=()=>{ syncing=false; };
  requestAnimationFrame(clear);
  setTimeout(clear,0);
}
function scanToRow(i){
  const pane=$("#scanPane"), img=$("#scan");
  if(!img.clientHeight || !D.geometry) return;
  const [t,b]=band(i);
  const centre=((t+b)/2)*img.clientHeight;
  guarded(()=>{ pane.scrollTop = centre - pane.clientHeight/2; });
}
// rows pane -> scan pane, continuous (not just on selection)
$("#rowPane").addEventListener("scroll",()=>{
  if(!locked()||syncing||!D.geometry||!rows.length) return;
  const pane=$("#rowPane");
  const max=pane.scrollHeight-pane.clientHeight;
  const frac = max>0 ? pane.scrollTop/max : 0;
  const first=D.geometry.first_row_top, last=first+(rows.length-1)*D.geometry.row_pitch;
  const y = first + frac*(last-first);
  const sp=$("#scanPane"), img=$("#scan");
  guarded(()=>{ sp.scrollTop = y*img.clientHeight - sp.clientHeight*0.35; });
});
// scan pane -> rows pane
$("#scanPane").addEventListener("scroll",()=>{
  if(!locked()||syncing||!D.geometry||!rows.length) return;
  const sp=$("#scanPane"), img=$("#scan");
  if(!img.clientHeight) return;
  const y=(sp.scrollTop+sp.clientHeight*0.35)/img.clientHeight;
  const g=D.geometry;
  const idx=Math.round((y-g.first_row_top)/g.row_pitch);
  const tr=document.querySelector(`#rows tr[data-i="${Math.max(0,Math.min(rows.length-1,idx))}"]`);
  if(tr) guarded(()=>tr.scrollIntoView({block:"center"}));
});

// ---- find ----
function runFind(){
  const q=$("#findq").value.trim();
  document.querySelectorAll("#rows tr").forEach(tr=>tr.classList.remove("hit"));
  const scope=$("#scope").value;
  hits = q ? rows.map((r,i)=>rowMatches(r,q,scope)?i:-1).filter(i=>i>=0) : [];
  hitAt = hits.length?0:-1;
  $("#findcount").textContent = q ? (hits.length? `1/${hits.length}` : "no match") : "";
  hits.forEach(i=>document.querySelector(`#rows tr[data-i="${i}"]`)?.classList.add("hit"));
  if(hits.length) select(hits[0]);
}
function step(d){
  if(!hits.length) return;
  hitAt=(hitAt+d+hits.length)%hits.length;
  $("#findcount").textContent=`${hitAt+1}/${hits.length}`;
  select(hits[hitAt]);
}
$("#findq").addEventListener("input",runFind);
$("#scope").addEventListener("change",runFind);

// The scope menu. A native <select> is kept as the value — every other piece of
// code and every assertion reads `#scope.value` — and this drives it, because
// the native popup could only be dismissed by choosing something: clicking the
// control again did not close it, which makes a search scope feel like a
// commitment rather than a look.
const scopeMenu=$("#scopemenu"), scopeBtn=$("#scopebtn");
function scopeOpen(){ return !scopeMenu.hidden; }
function renderScopeMenu(){
  const cur=$("#scope").value;
  scopeMenu.innerHTML=[...$("#scope").options].map(o=>
    `<li role="option" data-v="${o.value}" aria-selected="${o.value===cur}">${o.textContent}</li>`).join("");
  $("#scopelabel").textContent=$("#scope").selectedOptions[0].textContent;
}
function setScopeOpen(open){
  scopeMenu.hidden=!open;
  scopeBtn.setAttribute("aria-expanded", open?"true":"false");
  if(open) renderScopeMenu();
}
scopeBtn.addEventListener("click",e=>{ e.stopPropagation(); setScopeOpen(!scopeOpen()); });
scopeMenu.addEventListener("click",e=>{
  const li=e.target.closest("li"); if(!li) return;
  $("#scope").value=li.dataset.v;
  $("#scope").dispatchEvent(new Event("change"));
  setScopeOpen(false); scopeBtn.focus();
});
document.addEventListener("click",e=>{ if(scopeOpen() && !e.target.closest("#scopewrap")) setScopeOpen(false); });
document.addEventListener("keydown",e=>{ if(e.key==="Escape" && scopeOpen()){ setScopeOpen(false); scopeBtn.focus(); }});
// the label follows the value however it was set, including from a test
$("#scope").addEventListener("change",renderScopeMenu);
renderScopeMenu();
$("#next").onclick=()=>step(1); $("#prev").onclick=()=>step(-1);
$("#findq").addEventListener("keydown",e=>{
  if(e.key==="Enter"){e.preventDefault();step(e.shiftKey?-1:1);}
  if(e.key==="Escape"){$("#findq").value="";runFind();$("#findq").blur();}
});

// Ctrl/Cmd+F is intercepted: native find cannot see the scan, and would miss
// rows once this list is virtualized. Shift+Ctrl+F falls through to the browser.
addEventListener("keydown",e=>{
  const typing=e.target.isContentEditable||e.target.tagName==="INPUT";
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"&&!e.shiftKey){
    e.preventDefault();$("#findq").focus();$("#findq").select();return;
  }
  if(typing) return;
  if(e.key==="ArrowDown"){e.preventDefault();select(sel+1);}
  if(e.key==="ArrowUp"){e.preventDefault();select(sel-1);}
  if(e.key.toLowerCase()==="v"&&rows.length){rows[sel].verified=!rows[sel].verified;render();}
});

// ---- editing ----
$("#rows").addEventListener("click",e=>{
  const tr=e.target.closest("tr"); if(!tr) return;
  if(e.target.dataset.v){ rows[+tr.dataset.i].verified=!rows[+tr.dataset.i].verified; render(); scheduleSave(); return; }
  select(+tr.dataset.i);
});
let saveTimer=null, saveState="";
// Save state lives beside the row counts rather than replacing them: stat() runs
// on every render, and having it clobber "salvo" made autosave look broken.
function markSaved(t){ saveState=t; stat(); }
function scheduleSave(){
  if(!SERVED||!D) return;
  clearTimeout(saveTimer);
  markSaved("alterações não salvas…");
  saveTimer=setTimeout(()=>{
    const dir=STATE.dir?`&dir=${encodeURIComponent(STATE.dir)}`:"";
    fetch(`/api/save?pdf=${encodeURIComponent(D.file)}${dir}`,{
      method:"POST",headers:{"Content-Type":"application/json"},
      body:JSON.stringify({rows,geometry:D.geometry,page:D.pages[pageIdx].n,
                           source:(D.geometry&&D.geometry.bands_source==="detected")?"manual":"manual"})
    }).then(r=>r.json()).then(j=>{
      markSaved(j.saved?`salvo (${j.rows} linhas)`:"falha ao salvar");
    }).catch(()=>markSaved("falha ao salvar"));
  },900);
}
$("#rows").addEventListener("input",e=>{
  const f=e.target.dataset.f; if(!f) return;
  const r=rows[+e.target.closest("tr").dataset.i];
  r.edits=r.edits||[]; r.edits.push({field:f,to:e.target.textContent,at:new Date().toISOString()});
  e.target.classList.remove("null");
  // a human has now supplied this value, so the model's confidence no longer
  // applies to it: show it as verified rather than keeping a stale amber dot
  const d=e.target.parentElement.querySelector(".dot");
  if(d){ d.className="dot person"; d.title=d.ariaLabel="conferido por pessoa"; }
  // reflect the edit into the row model, then persist
  const idx=+e.target.closest("tr").dataset.i;
  const val=e.target.textContent.trim();
  if(f==="name"){
    // what the person typed is the reading; the split is derived from it
    rows[idx].name_raw = val;
    const [sur, giv] = splitName(val);
    rows[idx].surname = sur; rows[idx].given = giv;
  } else {
    rows[idx][f] = val==="" || val==="ilegível" ? null : val;
  }
  scheduleSave();
});
$("#lock").onclick=e=>{const b=e.currentTarget;b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));};
$("#crop").onclick=e=>{const b=e.currentTarget;b.setAttribute("aria-pressed",String(b.getAttribute("aria-pressed")!=="true"));paintBand(sel);};
$("#editmode").onclick=e=>{
  const b=e.currentTarget;
  EDIT = b.getAttribute("aria-pressed")!=="true";
  b.setAttribute("aria-pressed",String(EDIT));
  document.body.classList.toggle("editing",EDIT);
  render(); select(sel,false);
};
function refreshExport(){
  const a=$("#exportcsv");
  if(!a) return;
  const h = D && (D.hash || D.id);
  if(SERVED && h){ a.href=`/api/export?hash=${encodeURIComponent(h)}`; a.removeAttribute("aria-disabled"); }
  else { a.removeAttribute("href"); a.setAttribute("aria-disabled","true"); }
}
// ---- other readings of a word ----------------------------------------------
function closeAltMenu(){ const m=document.querySelector(".altmenu"); if(m) m.remove(); }
document.addEventListener("click",e=>{
  const pill = e.target.closest(".altword");
  if(!pill){ closeAltMenu(); return; }
  closeAltMenu();
  const tr = pill.closest("tr"), i = +tr.dataset.i, w = +pill.dataset.w;
  const r = rows[i], alts = (r.name_alts||[])[w] || [];
  const words = nameText(r).split(/\s+/);
  const menu = document.createElement("div");
  menu.className = "altmenu";
  const readings = `<div class="why">outras leituras do motor</div>`
    + [words[w], ...alts].map(o =>
        `<button data-o="${o}" class="${o===words[w]?"on":""}">${o}</button>`).join("");
  menu.innerHTML = readings + (GUESSES ? `<div class="why guessy">carregando…</div>` : "");
  document.body.appendChild(menu);
  // The guesses are fetched rather than baked in: they come from the archive's
  // own typed pages, they are not what the page says, and the menu has to be
  // usable before they arrive.
  if(GUESSES) fetchGuesses(menu, words[w], readings);
  const box = pill.getBoundingClientRect();
  menu.style.left = `${Math.round(box.left + scrollX)}px`;
  menu.style.top = `${Math.round(box.bottom + scrollY + 2)}px`;
  menu.addEventListener("click", ev=>{
    const b = ev.target.closest("button"); if(!b) return;
    chooseReading(i, w, b.dataset.o);
    closeAltMenu();
  });
});
// Names this archive is known to carry, offered for a word the engine mangled.
// They are guesses and everything about how they are shown says so: their own
// section, their own colour, the word "palpite", and never mixed in among the
// readings unless the person asked for that too. Nothing is stored unless one is
// chosen, and then it is stored as that person's typing, like any correction.
let GUESSES=false, GUESSES_FIRST=false;
function fetchGuesses(menu, word, readings){
  fetch(`/api/names?q=${encodeURIComponent(word)}`).then(r=>r.json()).then(j=>{
    if(!document.body.contains(menu)) return;
    const gs=(j.guesses||[]);
    const block = gs.length
      ? `<div class="why guessy">palpites do acervo — <b>não lidos da página</b></div>`
        + gs.map(g=>`<button data-o="${g.name}" class="guess"
             title="parecido com a leitura (${Math.round(g.score*100)}%) · ${g.seen}× neste acervo · palpite, confira no original"
             >${g.name}<i>≈</i></button>`).join("")
      : `<div class="why guessy">nenhum nome parecido no acervo</div>`;
    menu.innerHTML = GUESSES_FIRST ? block + readings : readings + block;
  }).catch(()=>{ const w=menu.querySelector(".guessy"); if(w) w.textContent="palpites indisponíveis"; });
}
$("#guessbtn").addEventListener("click",()=>{
  GUESSES=!GUESSES;
  $("#guessbtn").setAttribute("aria-pressed", GUESSES?"true":"false");
  $("#guessfirst").hidden=!GUESSES;
  closeAltMenu();
});
$("#guessfirst").addEventListener("click",()=>{
  GUESSES_FIRST=!GUESSES_FIRST;
  $("#guessfirst").setAttribute("aria-pressed", GUESSES_FIRST?"true":"false");
  closeAltMenu();
});

// Choosing between readings the engine produced is a correction like any other:
// it is recorded, the row counts as checked by a person, and it is saved.
function chooseReading(i, w, word){
  const r = rows[i], words = nameText(r).split(/\s+/);
  if(words[w] === word) return;
  words[w] = word;
  const val = words.join(" ");
  r.name_raw = val;
  const [sur, giv] = splitName(val);
  r.surname = sur; r.given = giv;
  r.edits = r.edits || [];
  r.edits.push({field:"name", to:val, at:new Date().toISOString(), from:"leitura alternativa"});
  r.verified = true;
  render(); select(i,false); scheduleSave();
}
$("#reread").onclick=()=>startTranscription(true);
addEventListener("resize",()=>paintBand(sel));

// ---- boot ----
// Two ways to run. Opened from disk, the payload is embedded at build time,
// because file:// blocks fetch(). Served over http, the data comes from the
// API and the folder picker becomes available.
const SERVED = location.protocol.startsWith("http");
function loadData(){
  const el=document.getElementById("payload");
  if(el && el.textContent.trim()) return Promise.resolve(JSON.parse(el.textContent));
  if(SERVED) return fetch("/api/corpus").then(r=>r.json());
  return fetch("data.json").then(r=>r.json());
}
// The index bar is asked for before the corpus, and shown while it loads.
// Listing a folder reads every file in it, and during indexing the engine has
// the machine, so that listing can take half a minute — long enough for the
// page to look broken with nothing on it to say why.
bootIndexBar();
if(SERVED) $("#warn").textContent="Carregando a pasta…";
loadData().then(d=>{
  DB=d;
  $("#scan").onload=()=>paintBand(sel);
  if(SERVED) fetch("/api/engine").then(r=>r.json()).then(x=>{ENGINE=x; renderIndexBar(idxState); if(D&&!rows.length) renderEmpty();}).catch(()=>{});
  const g=(d.documents.find(x=>x.geometry)||{}).geometry;
  $("#warn").textContent="Protótipo. "+(g?g.note:"");
  openDoc(d.active||0);
}).catch(e=>{
  $("#warn").textContent = (idxState && idxState.status==="running")
    ? "A pasta não pôde ser lida enquanto a indexação ocupa a máquina. Espere terminar e recarregue."
    : "Sem dados. Gere com: python3 scripts/make_prototype.py   ("+e+")";
});
</script>
